image boot.vfat {
    vfat {
        files = {
            "EFI",
            "boot"
        }
    }
    size = 256M
}

image OwlCarOS.img {
    hdimage {
        partition-table-type = "gpt"
    }

    partition boot {
        partition-type-uuid = U
        image = "boot.vfat"
        offset = 1M
    }

    partition rootfs {
        partition-type-uuid = L
        partition-uuid = "b7af6605-daf4-4d2b-aac9-d4c5372bcc1d"
        image = "rootfs.ext2"
    }
}
