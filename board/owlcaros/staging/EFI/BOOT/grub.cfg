set default="0"
set timeout="5"

menuentry "OwlCarOS Debug" {
    linux /boot/bzImage root=PARTUUID=b7af6605-daf4-4d2b-aac9-d4c5372bcc1d rootwait console=ttyS0,115200 console=tty0 loglevel=7
}
menuentry "OwlCarOS Installer (Graphical)" {
    linux /boot/bzImage root=PARTUUID=b7af6605-daf4-4d2b-aac9-d4c5372bcc1d rootwait console=ttyS0,115200 console=tty0 loglevel=4 owlcaros.installer=1
}
menuentry "OwlCarOS Installer (Console)" {
    linux /boot/bzImage root=PARTUUID=b7af6605-daf4-4d2b-aac9-d4c5372bcc1d rootwait console=ttyS0,115200 console=tty0 loglevel=7 init=/sbin/owlcaros-installer-init
}
